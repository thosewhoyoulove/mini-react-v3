<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini React Lab</title>
    <style>
      :root {
        color: #172033;
        background: #f3f5f9;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #b8c1d1;
        border-radius: 8px;
        color: #172033;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        border-color: #526de8;
        color: #304ecf;
      }
      .app {
        width: min(760px, calc(100% - 32px));
        margin: 48px auto;
      }
      header {
        margin-bottom: 28px;
      }
      h1 {
        margin: 6px 0 10px;
        font-size: clamp(28px, 5vw, 42px);
        letter-spacing: -0.03em;
      }
      h2 {
        margin: 0 0 18px;
        font-size: 18px;
      }
      .eyebrow {
        margin: 0;
        color: #526de8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .intro,
      .hint {
        color: #626d80;
        line-height: 1.65;
      }
      .card {
        margin: 16px 0;
        padding: 22px;
        border: 1px solid #dde2eb;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 30px rgb(35 48 79 / 6%);
      }
      .value {
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 16px;
        font-weight: 700;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0;
        list-style: none;
      }
      .chips li {
        padding: 6px 10px;
        border-radius: 999px;
        color: #304ecf;
        background: #edf0ff;
      }
      .log {
        min-height: 52px;
        max-height: 180px;
        overflow: auto;
        padding: 12px 12px 12px 36px;
        border-radius: 8px;
        color: #d7e1ff;
        background: #172033;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        line-height: 1.7;
      }
      .hint {
        margin: 14px 0 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
